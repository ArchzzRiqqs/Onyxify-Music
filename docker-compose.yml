services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onyxify
      POSTGRES_USER: onyxify
      POSTGRES_PASSWORD: onyxify
    ports:
      - "5432:5432"
    volumes:
      - onyxify-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onyxify -d onyxify"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://onyxify:onyxify@postgres:5432/onyxify
      AUTH_SECRET: replace-with-a-long-random-secret
      JAMENDO_CLIENT_ID: replace-with-jamendo-client-id
      MUSIC_PROVIDER: fixtures
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  onyxify-postgres:
